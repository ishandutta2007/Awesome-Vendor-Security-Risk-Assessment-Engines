<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cyber-grid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="radar-beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Filter Glows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0%, 100% { r: 120px; opacity: 0.25; }
        50% { r: 135px; opacity: 0.55; }
      }
      @keyframes pulseRing2 {
        0%, 100% { r: 75px; opacity: 0.3; }
        50% { r: 90px; opacity: 0.7; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes nodeBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(500px); }
      }
      .radar-arm {
        transform-origin: 1040px 210px;
        animation: radarSweep 8s linear infinite;
      }
      .ring-pulse-1 {
        animation: pulseRing 4s ease-in-out infinite;
      }
      .ring-pulse-2 {
        animation: pulseRing2 3s ease-in-out infinite;
      }
      .floating-pill-1 {
        animation: floatSlow1 5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 6s ease-in-out infinite;
      }
      .node-1 { animation: nodeBlink 2.5s ease-in-out infinite; }
      .node-2 { animation: nodeBlink 3.2s ease-in-out infinite 0.7s; }
      .node-3 { animation: nodeBlink 2.8s ease-in-out infinite 1.4s; }
      .node-4 { animation: nodeBlink 3.5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Overlay -->
  <g opacity="0.18">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360" stroke="#38bdf8" stroke-width="0.8" />
    <path d="M 120 0 L 120 420 M 240 0 L 240 420 M 360 0 L 360 420 M 480 0 L 480 420 M 600 0 L 600 420 M 720 0 L 720 420 M 840 0 L 840 420 M 960 0 L 960 420 M 1080 0 L 1080 420" stroke="#38bdf8" stroke-width="0.8" />
  </g>

  <!-- Glowing Ambiance Orbs (Background depth) -->
  <circle cx="1040" cy="210" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow-soft)" />
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.1" filter="url(#glow-soft)" />

  <!-- Animated Supply Chain Network & Radar Graphics (Right side) -->
  <g id="radar-system">
    <!-- Concentric Target / Risk Rings -->
    <circle cx="1040" cy="210" r="170" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.2" />
    <circle class="ring-pulse-1" cx="1040" cy="210" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" />
    <circle class="ring-pulse-2" cx="1040" cy="210" r="75" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.45" />
    <circle cx="1040" cy="210" r="30" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Crosshairs -->
    <line x1="860" y1="210" x2="1220" y2="210" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" opacity="0.25" />
    <line x1="1040" y1="30" x2="1040" y2="390" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" opacity="0.25" />

    <!-- Dynamic Rotating Radar Sweep -->
    <g class="radar-arm">
      <path d="M 1040 210 L 1190 140 A 170 170 0 0 0 1040 40 Z" fill="url(#radar-beam-grad)" />
      <line x1="1040" y1="210" x2="1190" y2="140" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
    </g>

    <!-- Network Vendor Risk Nodes -->
    <g stroke="#38bdf8" stroke-width="1.2" opacity="0.4">
      <line x1="1040" y1="210" x2="960" y2="150" />
      <line x1="1040" y1="210" x2="1120" y2="160" />
      <line x1="1040" y1="210" x2="1000" y2="280" />
      <line x1="1040" y1="210" x2="1100" y2="270" />
      <line x1="960" y1="150" x2="910" y2="190" />
    </g>

    <!-- Node Points (Vendor Dots) -->
    <circle class="node-1" cx="960" cy="150" r="5" fill="#38bdf8" filter="url(#glow-cyan)" />
    <circle class="node-2" cx="1120" cy="160" r="4.5" fill="#10b981" filter="url(#glow-cyan)" />
    <circle class="node-3" cx="1000" cy="280" r="5" fill="#f59e0b" filter="url(#glow-cyan)" />
    <circle class="node-4" cx="1100" cy="270" r="4" fill="#ef4444" filter="url(#glow-cyan)" />
    <circle cx="910" cy="190" r="3.5" fill="#a855f7" />

    <!-- Central Shield Symbol in Radar -->
    <g transform="translate(1025, 195) scale(0.9)">
      <path d="M16 2 L4 7 V14 C4 21.5 9.1 28.5 16 30 C22.9 28.5 28 21.5 28 14 V7 L16 2 Z" 
            fill="url(#shield-grad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-cyan)" />
      <path d="M12 15 L15 18 L21 11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- FOREGROUND LAYER: Content strictly positioned so it is NEVER obscured -->
  <!-- Top Super-Badge -->
  <g transform="translate(70, 52)">
    <rect width="365" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">
      TOP VENDOR SECURITY RISK ASSESSMENT ENGINES
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(70, 125)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
      Vendor Security Risk
    </text>
    <text y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
      Assessment Engines <tspan fill="#38bdf8">⚡</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(70, 215)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated directory of SaaS TPRM platforms, automated security questionnaire engines,
    </text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      and open-source tools for auditing software supply chain cybersecurity risk.
    </text>
  </g>

  <!-- Animated Feature Badges / Category Pills in Foreground -->
  <g transform="translate(70, 288)" class="floating-pill-1">
    <!-- Pill 1: TPRM -->
    <g transform="translate(0, 0)">
      <rect width="185" height="38" rx="8" fill="url(#pill-bg)" stroke="#0284c7" stroke-width="1.2" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">
        🛡️ Third-Party Risk
      </text>
    </g>

    <!-- Pill 2: Questionnaires -->
    <g transform="translate(200, 0)">
      <rect width="215" height="38" rx="8" fill="url(#pill-bg)" stroke="#6366f1" stroke-width="1.2" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">
        📋 Auto-Questionnaires
      </text>
    </g>

    <!-- Pill 3: Supply Chain -->
    <g transform="translate(430, 0)">
      <rect width="200" height="38" rx="8" fill="url(#pill-bg)" stroke="#0d9488" stroke-width="1.2" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ccfbf1">
        📦 Supply Chain Audits
      </text>
    </g>
  </g>

  <g transform="translate(70, 342)" class="floating-pill-2">
    <!-- Pill 4: Cyber Ratings -->
    <g transform="translate(0, 0)">
      <rect width="205" height="36" rx="8" fill="url(#pill-bg)" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ede9fe">
        ⚡ Continuous Cyber Ratings
      </text>
    </g>

    <!-- Pill 5: SBOM & Compliance -->
    <g transform="translate(220, 0)">
      <rect width="210" height="36" rx="8" fill="url(#pill-bg)" stroke="#0284c7" stroke-width="1.2" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e0f2fe">
        🔍 SBOM &amp; Vulnerability Vetting
      </text>
    </g>

    <!-- Pill 6: Open-Source Focus -->
    <g transform="translate(445, 0)">
      <rect width="185" height="36" rx="8" fill="url(#pill-bg)" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">
        🌟 Open-Source Stacks
      </text>
    </g>
  </g>

  <!-- Border Highlight line at bottom -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accent-grad)" rx="2" />
</svg>
